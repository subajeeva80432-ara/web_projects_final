<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            padding: 20px;
        }

        .container {
            display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; align-items: flex-start;
        }

        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            width: 320px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        h2 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #00b09b, #96c93d);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border-color: #f7971e;
        }

        .input-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        button {
            border: none; cursor: pointer; font-size: 1rem;
            border-radius: 12px; padding: 14px 30px;
            font-weight: 600; transition: all 0.2s; margin-top: 10px;
            width: 100%;
        }

        .btn-display {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #1a1a2e;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        button:active { transform: translateY(0); }

        .profile-display {
            display: none;
        }

        .profile-display.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px;
            font-size: 2.2rem; font-weight: 700; color: #1a1a2e;
        }

        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px;
        }

        .detail-value {
            font-size: 1rem; font-weight: 600; color: #fff;
        }

        .grade-badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 18px;
            letter-spacing: 1px;
        }

        .grade-aplus { background: linear-gradient(135deg, #00b09b, #96c93d); color: #1a1a2e; }
        .grade-a { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #1a1a2e; }
        .grade-b { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; }
        .grade-c { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .grade-d { background: linear-gradient(135deg, #e53935, #e35d5b); color: #fff; }
        .grade-f { background: linear-gradient(135deg, #434343, #000000); color: #e53935; border: 1px solid #e53935; }

        .input-group input.error {
            border-color: #e53935;
        }

        .field-error {
            color: #e53935;
            font-size: 0.78rem;
            margin-top: 5px;
            display: none;
            letter-spacing: 0.5px;
        }

        
        .error-msg {
            color: #e53935;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }


        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }


        .shake {
            animation: shake 0.4s ease;
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Student Profile</h1>
            <div class="input-group">
                <label>Student Name</label>
                <input type="text" id="nameInput" placeholder="Enter your name">
                <div class="field-error" id="nameError">Required field</div>
            </div>
            <div class="input-group">
                <label>Roll Number</label>
                <input type="text" id="rollInput" placeholder="Enter roll number">
                <div class="field-error" id="rollError">Required field</div>
            </div>
            <div class="input-group">
                <label>Marks (0 - 100)</label>
                <input type="number" id="marksInput" placeholder="Enter marks" min="0" max="100">
                <div class="field-error" id="marksError">Required field</div>
            </div>
            <div class="error-msg" id="errorMsg">Please fill all fields correctly</div>
            <button class="btn-display" id="displayBtn">Display Profile</button>
        </div>

        <div class="card profile-display" id="profileCard">
            <h2>Profile Card</h2>
            <div class="avatar" id="avatar">A</div>
            <div class="detail-row">
                <span class="detail-label">Name</span>
                <span class="detail-value" id="displayName">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Roll No</span>
                <span class="detail-value" id="displayRoll">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Marks</span>
                <span class="detail-value" id="displayMarks">-</span>
            </div>
            <div id="gradeContainer"></div>
        </div>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const rollInput = document.getElementById('rollInput');
        const marksInput = document.getElementById('marksInput');
        const displayBtn = document.getElementById('displayBtn');
        const profileCard = document.getElementById('profileCard');
        const errorMsg = document.getElementById('errorMsg');
        const nameError = document.getElementById('nameError');
        const rollError = document.getElementById('rollError');
        const marksError = document.getElementById('marksError');

        function clearErrors() {
            nameInput.classList.remove('error');
            rollInput.classList.remove('error');
            marksInput.classList.remove('error');
            nameError.style.display = 'none';
            rollError.style.display = 'none';
            marksError.style.display = 'none';
            errorMsg.style.display = 'none';
        }

        function getGrade(marks) {
            if (marks >= 90) return { grade: 'A+', class: 'grade-aplus' };
            if (marks >= 80) return { grade: 'A', class: 'grade-a' };
            if (marks >= 70) return { grade: 'B', class: 'grade-b' };
            if (marks >= 60) return { grade: 'C', class: 'grade-c' };
            if (marks >= 50) return { grade: 'D', class: 'grade-d' };
            return { grade: 'F', class: 'grade-f' };
        }

        displayBtn.addEventListener('click', () => {
            clearErrors();

            const name = nameInput.value.trim();
            const roll = rollInput.value.trim();
            const marks = parseInt(marksInput.value);

            let hasError = false;

            if (name === '') {
                nameInput.classList.add('error');
                nameError.style.display = 'block';
                hasError = true;
            }

            if (roll === '') {
                rollInput.classList.add('error');
                rollError.style.display = 'block';
                hasError = true;
            }

            if (isNaN(marks) || marks < 0 || marks > 100) {
                marksInput.classList.add('error');
                marksError.style.display = 'block';
                hasError = true;
            }

            if (hasError) {
                document.querySelector('.card').classList.add('shake');
                setTimeout(() => document.querySelector('.card').classList.remove('shake'), 400);
                return;
            }

            document.getElementById('displayName').textContent = name;
            document.getElementById('displayRoll').textContent = roll;
            document.getElementById('displayMarks').textContent = marks;
            document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();

            const { grade, class: gradeClass } = getGrade(marks);
            document.getElementById('gradeContainer').innerHTML =
                '<div class="grade-badge ' + gradeClass + '">Grade: ' + grade + '</div>';

            profileCard.classList.remove('show');
            void profileCard.offsetWidth;
            profileCard.classList.add('show');
        });
    </script>
</body>
</html>
