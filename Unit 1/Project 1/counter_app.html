<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 1.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .count {
            font-size: 5rem;
            font-weight: 700;
            margin: 10px 0 30px;
            transition: transform 0.15s;
            user-select: none;
        }
        .count.pop { transform: scale(1.15); }
        .buttons { display: flex; gap: 14px; justify-content: center; align-items: center; }
        button {
            border: none; cursor: pointer; font-size: 1.1rem;
            border-radius: 12px; padding: 12px 28px;
            font-weight: 600; transition: all 0.2s;
        }
        .btn-inc, .btn-dec {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #1a1a2e;
        }
        .btn-dec { background: linear-gradient(135deg, #e53935, #e35d5b); color: #fff; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        button:active { transform: translateY(0); }
        .btn-reset {
            background: rgba(255,255,255,0.1);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .btn-reset:hover { background: rgba(255,255,255,0.2); color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Counter App</h1>
        <div class="count" id="count">0</div>
        <button class="btn-reset" id="resetBtn">Reset</button>
        <div class="buttons">
            <button class="btn-dec" id="decBtn">- 1</button>
            <button class="btn-inc" id="incBtn">+ 1</button>
        </div>
    </div>

    <script>
        const countEl = document.getElementById('count');
        const incBtn = document.getElementById('incBtn');
        const decBtn = document.getElementById('decBtn');
        const resetBtn = document.getElementById('resetBtn');
        let count = 0;

        function updateDisplay() {
            countEl.textContent = count;
            countEl.classList.add('pop');
            setTimeout(() => countEl.classList.remove('pop'), 150);
        }

        incBtn.addEventListener('click', () => { count++; updateDisplay(); });
        decBtn.addEventListener('click', () => { count--; updateDisplay(); });
        resetBtn.addEventListener('click', () => { count = 0; updateDisplay(); });
    </script>
</body>
</html>
