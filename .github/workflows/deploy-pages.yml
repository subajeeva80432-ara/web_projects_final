name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build all projects
        run: |
          set -euo pipefail
          mkdir -p _site
          mkdir -p _site/unit-1/project-1 _site/unit-1/project-2
          touch _site/.nojekyll

          cp 'Unit 1/Project 1/counter_app.html' _site/unit-1/project-1/index.html
          cp 'Unit 1/Project 2/grade_system.html' _site/unit-1/project-2/index.html

          build_project() {
            local source="$1"
            local destination="$2"
            (
              cd "$source"
              npm ci
              npm run build -- --base="/web_projects_final/${destination}/"
            )
            mkdir -p "_site/${destination}"
            cp -R "${source}/dist/." "_site/${destination}/"
          }

          build_project 'Unit 2/Project 1' 'unit-2/project-1'
          build_project 'Unit 2/Project 2' 'unit-2/project-2'
          build_project 'Unit 3/Project 1' 'unit-3/project-1'
          build_project 'Unit 3/Project 2' 'unit-3/project-2'
          build_project 'Unit 4/Project 1' 'unit-4/project-1'
          build_project 'Unit 4/Project 2' 'unit-4/project-2'
          build_project 'Unit 5/Project 1' 'unit-5/project-1'
          build_project 'Unit 5/Project 2' 'unit-5/project-2'

          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4